<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelePlay - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
    .admin-container { max-width: 900px; margin: 0 auto; }
    
    h1 { font-size: 22px; margin-bottom: 20px; color: var(--accent-red); }

    /* Search Box Design */
    .admin-search-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .admin-search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 14px;
    }
    .admin-search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .admin-search-input:focus {
      border-color: var(--accent-red);
    }

    /* Movie List Table Design */
    .movie-table-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--glass-border); font-size: 13px; }
    th { background: rgba(255,255,255,0.03); color: var(--text-sub); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    
    .poster-td img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; }
    
    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 4px;
      transition: 0.2s;
    }
    .btn-edit { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .btn-edit:hover { background: var(--accent-green); color: #fff; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-delete:hover { background: var(--accent-red); color: #fff; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1><i class="fa-solid fa-film"></i> Movie Management</h1>

    <!-- Search Box -->
    <div class="admin-search-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input 
        type="text" 
        id="admin-search-input" 
        class="admin-search-input" 
        placeholder="ရုပ်ရှင်အမည် သို့မဟုတ် Category ဖြင့် ရှာရန်..." 
        onkeyup="filterAdminMovies()"
      >
    </div>

    <!-- Movie Table -->
    <div class="movie-table-card">
      <table>
        <thead>
          <tr>
            <th>Poster</th>
            <th>Title</th>
            <th>Type</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="movie-table-body">
          <!-- Data တွေ JavaScript နဲ့ ရောက်လာပါမယ် -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allAdminMovies = [];

    document.addEventListener('DOMContentLoaded', loadAdminMovies);

    // Supabase ထဲမှ ရုပ်ရှင်များ ဆွဲယူခြင်း
    async function loadAdminMovies() {
      const { data, error } = await sb.from('movies').select('*').order('id', { ascending: false });
      if (error) {
        console.error('Error fetching movies:', error.message);
        return;
      }
      allAdminMovies = data || [];
      renderAdminTable(allAdminMovies);
    }

    // Table ထဲ Render လုပ်ပေးသည့် Function
    function renderAdminTable(movies) {
      const tbody = document.getElementById('movie-table-body');
      
      if (movies.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-sub);">ရုပ်ရှင် ရှာမတွေ့ပါ။</td></tr>`;
        return;
      }

      tbody.innerHTML = movies.map(m => `
        <tr>
          <td class="poster-td">
            <img src="${m.poster_url}" onerror="this.src='https://via.placeholder.com/40x56'">
          </td>
          <td style="font-weight: 600; color: #fff;">${m.title}</td>
          <td><span style="background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius:4px; font-size:11px;">${m.type || 'Movie'}</span></td>
          <td style="color: var(--text-sub);">${m.category || 'General'}</td>
          <td>
            <button class="btn-action btn-edit" onclick="handleEdit(${m.id})"><i class="fa-solid fa-pen"></i> Edit</button>
            <button class="btn-action btn-delete" onclick="handleDelete(${m.id})"><i class="fa-solid fa-trash"></i> Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // Search Box မှ စာရိုက်တိုင်း Filter လုပ်ပေးသည့် Function
    function filterAdminMovies() {
      const query = document.getElementById('admin-search-input').value.toLowerCase().trim();
      
      const filtered = allAdminMovies.filter(m => {
        const titleMatch = m.title && m.title.toLowerCase().includes(query);
        const catMatch = m.category && m.category.toLowerCase().includes(query);
        const typeMatch = m.type && m.type.toLowerCase().includes(query);
        return titleMatch || catMatch || typeMatch;
      });

      renderAdminTable(filtered);
    }

    // Edit Function
    function handleEdit(id) {
      const movie = allAdminMovies.find(m => m.id === id);
      alert(`Edit လုပ်မည်: ${movie.title}\n(သင့် Admin Form ထဲသို့ Data များ ထည့်သွင်းပေးနိုင်ပါသည်)`);
    }

    // Delete Function
    async function handleDelete(id) {
      if (confirm('ဒီရုပ်ရှင်ကို ဖျက်ရန် သေချာပါသလား?')) {
        const { error } = await sb.from('movies').delete().eq('id', id);
        if (error) {
          alert('Delete လုပ်ရတာ မအောင်မြင်ပါ: ' + error.message);
        } else {
          alert('ဖျက်ပြီးပါပြီ!');
          loadAdminMovies(); // Table ပြန် Refresh လုပ်မည်
        }
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelePlay - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1, h2 { color: #f59e0b; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #f59e0b; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 12px; margin-top: 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; }
    button:hover { background: #d97706; }
    .btn-cancel { background: #475569; color: #fff; margin-top: 5px; }
    .btn-cancel:hover { background: #334155; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #f59e0b; }
    .action-btn { padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .poster-preview { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }
    #msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; font-weight: bold; }
    .success { background: #15803d; color: #fff; }
    .error { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>

  <h1>🎬 TelePlay Admin Panel</h1>
  
  <div id="msg"></div>

  <!-- Form -->
  <div class="card">
    <h2 id="form-title">➕ Add New Movie/Series</h2>
    <form id="movie-form">
      <input type="hidden" id="movie-id">
      
      <label>Movie/Series Title *</label>
      <input type="text" id="title" required placeholder="e.g. Moana 2">

      <div class="row">
        <div>
          <label>Type *</label>
          <select id="type">
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
          </select>
        </div>
        <div>
          <label>Category (Genre) *</label>
          <input type="text" id="category" required placeholder="e.g. Action, Drama">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Quality</label>
          <input type="text" id="quality" placeholder="e.g. 1080p, 720p, 4K" value="1080p">
        </div>
        <div>
          <label>Rating ⭐</label>
          <input type="text" id="rating" placeholder="e.g. 8.5" value="8.0">
        </div>
      </div>

      <label>Poster Image URL *</label>
      <input type="url" id="poster_url" required placeholder="https://image.tmdb.org/t/p/w500/...">

      <label>Telegram Stream/Download Link *</label>
      <input type="url" id="telegram_link" required placeholder="https://t.me/c/...">

      <label>Description / Storyline</label>
      <textarea id="description" rows="3" placeholder="Enter movie description..."></textarea>

      <button type="submit" id="btn-submit"> Save Movie</button>
      <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">Cancel Edit</button>
    </form>
  </div>

  <!-- Data List -->
  <div class="card">
    <h2>📋 Movie List (<span id="total-count">0</span>)</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Poster</th>
            <th>Title</th>
            <th>Type</th>
            <th>Rating</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="movie-list">
          <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let moviesList = [];

    function showMsg(text, isError = false) {
      const msg = document.getElementById('msg');
      msg.innerText = text;
      msg.className = isError ? 'error' : 'success';
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }

    async function fetchMovies() {
      const { data, error } = await sb.from('movies').select('*').order('id', { ascending: false });
      if (error) {
        showMsg('Error fetching movies: ' + error.message, true);
        return;
      }
      moviesList = data || [];
      document.getElementById('total-count').innerText = moviesList.length;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('movie-list');
      tbody.innerHTML = '';
      if (moviesList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No items found.</td></tr>';
        return;
      }

      moviesList.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${m.poster_url || ''}" class="poster-preview" onerror="this.src='https://via.placeholder.com/40x60'"></td>
          <td><strong>${m.title}</strong><br><small style="color:#94a3b8">${m.category || ''}</small></td>
          <td>${m.type || 'Movie'}</td>
          <td>⭐ ${m.rating || 'N/A'}</td>
          <td>
            <button class="action-btn btn-edit" onclick="editMovie(${m.id})">Edit</button>
            <button class="action-btn btn-delete" onclick="deleteMovie(${m.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('movie-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('movie-id').value;
      
      const payload = {
        title: document.getElementById('title').value,
        type: document.getElementById('type').value,
        category: document.getElementById('category').value,
        quality: document.getElementById('quality').value,
        rating: document.getElementById('rating').value,
        poster_url: document.getElementById('poster_url').value,
        telegram_link: document.getElementById('telegram_link').value,
        description: document.getElementById('description').value
      };

      if (id) {
        // Update
        const { error } = await sb.from('movies').update(payload).eq('id', id);
        if (error) showMsg('Update Error: ' + error.message, true);
        else showMsg('Updated successfully!');
      } else {
        // Insert
        const { error } = await sb.from('movies').insert([payload]);
        if (error) showMsg('Insert Error: ' + error.message, true);
        else showMsg('Saved successfully!');
      }

      resetForm();
      fetchMovies();
    });

    function editMovie(id) {
      const m = moviesList.find(item => item.id === id);
      if (!m) return;
      document.getElementById('movie-id').value = m.id;
      document.getElementById('title').value = m.title || '';
      document.getElementById('type').value = m.type || 'Movie';
      document.getElementById('category').value = m.category || '';
      document.getElementById('quality').value = m.quality || '1080p';
      document.getElementById('rating').value = m.rating || '8.0';
      document.getElementById('poster_url').value = m.poster_url || '';
      document.getElementById('telegram_link').value = m.telegram_link || '';
      document.getElementById('description').value = m.description || '';

      document.getElementById('form-title').innerText = '✏️ Edit Movie ID: ' + m.id;
      document.getElementById('btn-submit').innerText = 'Update Movie';
      document.getElementById('btn-cancel').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteMovie(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      const { error } = await sb.from('movies').delete().eq('id', id);
      if (error) showMsg('Delete Error: ' + error.message, true);
      else {
        showMsg('Deleted successfully!');
        fetchMovies();
      }
    }

    function resetForm() {
      document.getElementById('movie-form').reset();
      document.getElementById('movie-id').value = '';
      document.getElementById('form-title').innerText = '➕ Add New Movie/Series';
      document.getElementById('btn-submit').innerText = 'Save Movie';
      document.getElementById('btn-cancel').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', fetchMovies);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelePlay - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0b1329; color: #fff; padding: 20px; max-width: 850px; margin: 0 auto; }
    h1, h2 { color: #f59e0b; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #f59e0b; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    
    /* Type Selection Radio Styles */
    .type-selector { display: flex; gap: 15px; margin-top: 8px; }
    .type-option { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .type-option input { width: auto; margin: 0; }

    /* Pure CSS Switcher */
    #movie-link-section { display: block; }
    #series-episodes-section { display: none; }

    /* Episode Builder Styles */
    .ep-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; }
    .ep-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .ep-row input { margin-top: 0; }
    .btn-add-ep { background: #10b981; color: #fff; padding: 8px 12px; font-size: 13px; width: auto; margin-top: 10px; }
    .btn-remove-ep { background: #ef4444; color: #fff; border: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    button { background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 12px; margin-top: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
    button:hover { background: #d97706; }
    .btn-cancel { background: #475569; color: #fff; margin-top: 5px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #f59e0b; }
    .action-btn { padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .poster-preview { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }
    #msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; font-weight: bold; }
    .success { background: #15803d; color: #fff; }
    .error { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>

  <h1>🎬 TelePlay Admin Panel</h1>
  <div id="msg"></div>

  <div class="card">
    <h2 id="form-title">➕ Add New Item</h2>
    <form id="movie-form">
      <input type="hidden" id="movie-id">
      
      <label>Title *</label>
      <input type="text" id="title" required placeholder="e.g. Moana 2 / Flex X Cop">

      <div class="row">
        <div>
          <label>Type *</label>
          <div class="type-selector">
            <label class="type-option">
              <input type="radio" name="item_type" value="Movie" checked onchange="switchType('Movie')"> 🎬 Movie
            </label>
            <label class="type-option">
              <input type="radio" name="item_type" value="Series" onchange="switchType('Series')"> 📺 Series
            </label>
          </div>
        </div>
        <div>
          <label>Category (Genre) *</label>
          <input type="text" id="category" required placeholder="e.g. Action, Drama">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Quality</label>
          <input type="text" id="quality" placeholder="1080p" value="1080p">
        </div>
        <div>
          <label>Rating ⭐</label>
          <input type="text" id="rating" placeholder="8.0" value="8.0">
        </div>
      </div>

      <label>Poster Image URL *</label>
      <input type="url" id="poster_url" required placeholder="https://image.tmdb.org/t/p/w500/...">

      <!-- Movie Single Link Section -->
      <div id="movie-link-section">
        <label>Telegram Stream/Download Link (Movie) *</label>
        <input type="url" id="telegram_link" placeholder="https://t.me/c/...">
      </div>

      <!-- Series Episodes Section -->
      <div id="series-episodes-section" class="ep-box">
        <label style="color: #f59e0b; margin:0;">📺 Series Episodes List</label>
        <div id="episodes-container"></div>
        <button type="button" onclick="addEpisodeRow()" class="btn-add-ep">+ Add Episode</button>
      </div>

      <label style="margin-top: 15px;">Description / Storyline</label>
      <textarea id="description" rows="3" placeholder="Enter storyline..."></textarea>

      <button type="submit" id="btn-submit">Save Item</button>
      <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">Cancel Edit</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 Items List (<span id="total-count">0</span>)</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Poster</th>
            <th>Title</th>
            <th>Type</th>
            <th>Rating</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="movie-list">
          <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let moviesList = [];

    // Switch between Movie & Series UI
    function switchType(type) {
      const movieSec = document.getElementById('movie-link-section');
      const seriesSec = document.getElementById('series-episodes-section');
      const container = document.getElementById('episodes-container');

      if (type === 'Series') {
        movieSec.style.display = 'none';
        seriesSec.style.display = 'block';
        if (container.children.length === 0) {
          addEpisodeRow('S1 E01', '');
        }
      } else {
        movieSec.style.display = 'block';
        seriesSec.style.display = 'none';
      }
    }

    // Add new Episode Row
    function addEpisodeRow(name = '', link = '') {
      const container = document.getElementById('episodes-container');
      const div = document.createElement('div');
      div.className = 'ep-row';
      div.innerHTML = `
        <input type="text" placeholder="Ep Name (e.g. S1 E01)" value="${name}" style="width: 35%;" class="ep-name">
        <input type="url" placeholder="Telegram Link" value="${link}" style="width: 55%;" class="ep-link">
        <button type="button" class="btn-remove-ep" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function getSelectedType() {
      const radios = document.getElementsByName('item_type');
      for (let r of radios) {
        if (r.checked) return r.value;
      }
      return 'Movie';
    }

    function getEpisodesData() {
      const rows = document.querySelectorAll('.ep-row');
      const list = [];
      rows.forEach(r => {
        const name = r.querySelector('.ep-name').value.trim();
        const link = r.querySelector('.ep-link').value.trim();
        if (name && link) list.push({ title: name, link: link });
      });
      return list;
    }

    function showMsg(text, isError = false) {
      const msg = document.getElementById('msg');
      msg.innerText = text;
      msg.className = isError ? 'error' : 'success';
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }

    async function fetchMovies() {
      const { data, error } = await sb.from('movies').select('*').order('id', { ascending: false });
      if (error) {
        showMsg('Error fetching data: ' + error.message, true);
        return;
      }
      moviesList = data || [];
      document.getElementById('total-count').innerText = moviesList.length;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('movie-list');
      tbody.innerHTML = '';
      if (moviesList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No items found.</td></tr>';
        return;
      }

      moviesList.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${m.poster_url || ''}" class="poster-preview" onerror="this.src='https://via.placeholder.com/40x60'"></td>
          <td><strong>${m.title}</strong><br><small style="color:#94a3b8">${m.category || ''}</small></td>
          <td>${m.type || 'Movie'}</td>
          <td>⭐ ${m.rating || 'N/A'}</td>
          <td>
            <button class="action-btn btn-edit" onclick="editMovie(${m.id})">Edit</button>
            <button class="action-btn btn-delete" onclick="deleteMovie(${m.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('movie-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('movie-id').value;
      const type = getSelectedType();

      const payload = {
        title: document.getElementById('title').value,
        type: type,
        category: document.getElementById('category').value,
        quality: document.getElementById('quality').value,
        rating: document.getElementById('rating').value,
        poster_url: document.getElementById('poster_url').value,
        telegram_link: type === 'Movie' ? document.getElementById('telegram_link').value : null,
        episodes: type === 'Series' ? getEpisodesData() : [],
        description: document.getElementById('description').value
      };

      if (id) {
        const { error } = await sb.from('movies').update(payload).eq('id', id);
        if (error) showMsg('Update Error: ' + error.message, true);
        else showMsg('Updated successfully!');
      } else {
        const { error } = await sb.from('movies').insert([payload]);
        if (error) showMsg('Insert Error: ' + error.message, true);
        else showMsg('Saved successfully!');
      }

      resetForm();
      fetchMovies();
    });

    function editMovie(id) {
      const m = moviesList.find(item => item.id === id);
      if (!m) return;
      document.getElementById('movie-id').value = m.id;
      document.getElementById('title').value = m.title || '';
      
      const type = m.type || 'Movie';
      const radios = document.getElementsByName('item_type');
      for (let r of radios) {
        r.checked = (r.value === type);
      }

      document.getElementById('category').value = m.category || '';
      document.getElementById('quality').value = m.quality || '1080p';
      document.getElementById('rating').value = m.rating || '8.0';
      document.getElementById('poster_url').value = m.poster_url || '';
      document.getElementById('telegram_link').value = m.telegram_link || '';
      document.getElementById('description').value = m.description || '';

      const container = document.getElementById('episodes-container');
      container.innerHTML = '';
      if (type === 'Series' && m.episodes && m.episodes.length > 0) {
        m.episodes.forEach(ep => addEpisodeRow(ep.title, ep.link));
      }

      switchType(type);

      document.getElementById('form-title').innerText = '✏️ Edit Item ID: ' + m.id;
      document.getElementById('btn-submit').innerText = 'Update Item';
      document.getElementById('btn-cancel').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteMovie(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      const { error } = await sb.from('movies').delete().eq('id', id);
      if (error) showMsg('Delete Error: ' + error.message, true);
      else {
        showMsg('Deleted successfully!');
        fetchMovies();
      }
    }

    function resetForm() {
      document.getElementById('movie-form').reset();
      document.getElementById('movie-id').value = '';
      document.getElementById('episodes-container').innerHTML = '';
      const radios = document.getElementsByName('item_type');
      if (radios.length > 0) radios[0].checked = true;
      switchType('Movie');
      document.getElementById('form-title').innerText = '➕ Add New Item';
      document.getElementById('btn-submit').innerText = 'Save Item';
      document.getElementById('btn-cancel').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', fetchMovies);
  </script>
</body>
</html>

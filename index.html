<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelePlay - Stream & Watch</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }

    /* Header & Search */
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #0b1120; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 22px; font-weight: 800; color: var(--accent-color); text-decoration: none; }
    .search-box { position: relative; width: 50%; max-width: 300px; }
    .search-box input { width: 100%; padding: 8px 12px 8px 36px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; color: #fff; font-size: 13px; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    /* Container */
    .container { padding: 16px; max-width: 1200px; margin: 0 auto; }

    /* Featured Carousel / Hero Banner */
    .featured-section { margin-bottom: 24px; }
    .hero-banner { width: 100%; height: 220px; border-radius: 12px; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; padding: 16px; box-shadow: inset 0 -100px 80px rgba(0,0,0,0.8); }
    .hero-content h2 { font-size: 20px; color: #fff; margin-bottom: 4px; }
    .hero-content p { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }

    /* Category / Genre Pills */
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-pill { padding: 6px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; font-size: 13px; color: var(--text-sub); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-pill.active, .cat-pill:hover { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }

    /* Movie Grid */
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; margin-bottom: 24px; }
    
    .movie-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid #334155; }
    .movie-card:hover { transform: translateY(-4px); }
    .poster-wrapper { position: relative; aspect-ratio: 2/3; width: 100%; background: #1e293b; }
    .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge-type { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: var(--accent-color); backdrop-filter: blur(4px); }
    .badge-rating { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #f59e0b; backdrop-filter: blur(4px); }
    
    .movie-info { padding: 8px; }
    .movie-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-meta { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

    /* Modal / Pop-up Window */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; max-height: 90vh; border-radius: 12px; overflow-y: auto; border: 1px solid #334155; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 16px; }
    
    .modal-hero { width: 100%; height: 200px; background-size: cover; background-position: center; position: relative; }
    .modal-body { padding: 16px; }
    .modal-title { font-size: 18px; font-weight:bold; margin-bottom: 6px; }
    .modal-genres { font-size: 12px; color: var(--accent-color); margin-bottom: 10px; }
    .modal-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 16px; }

    /* Episode Selector for Series */
    .episodes-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .ep-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 6px; text-decoration: none; color: #fff; border: 1px solid #334155; font-size: 13px; }
    .ep-item:hover { border-color: var(--accent-color); color: var(--accent-color); }
    .btn-watch { display: block; width: 100%; text-align: center; background: var(--accent-color); color: #000; padding: 12px; border-radius: 6px; font-weight: bold; text-decoration: none; margin-top: 10px; }

    /* Bottom Navigation Bar (Mobile View) */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0b1120; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); text-decoration: none; font-size: 10px; gap: 4px; cursor: pointer; }
    .nav-item.active, .nav-item:hover { color: var(--accent-color); }
    .nav-item i { font-size: 16px; }

    @media (min-width: 768px) {
      .hero-banner { height: 320px; }
      .bottom-nav { display: none; } /* PC View မှာ Bottom Nav ဖျောက်မည် */
      body { padding-bottom: 0; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">TELEPLAY</a>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search title..." onkeyup="filterMovies()">
    </div>
  </header>

  <div class="container">
    
    <!-- Hero Banner / Featured Movie -->
    <div class="featured-section" id="hero-section">
      <!-- JavaScript ဖြင့် Dynamic ထည့်ပေးမည် -->
    </div>

    <!-- Category / Genre Pills -->
    <div class="categories-bar" id="category-bar">
      <div class="cat-pill active" onclick="filterCategory('All')">All</div>
      <div class="cat-pill" onclick="filterCategory('Action')">Action</div>
      <div class="cat-pill" onclick="filterCategory('Drama')">Drama</div>
      <div class="cat-pill" onclick="filterCategory('Comedy')">Comedy</div>
      <div class="cat-pill" onclick="filterCategory('Romance')">Romance</div>
      <div class="cat-pill" onclick="filterCategory('Sci-Fi')">Sci-Fi</div>
    </div>

    <!-- Movies Grid Section -->
    <div class="section-title">
      <span id="section-heading">All Movies & Series</span>
      <small style="color: var(--text-sub); font-size: 12px;" id="item-count"></small>
    </div>
    
    <div class="movie-grid" id="movie-grid">
      <!-- Movies dynamic ရောက်လာမည် -->
    </div>

  </div>

  <!-- Bottom Mobile Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="filterCategory('All')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="filterType('Movie')">
      <i class="fa-solid fa-film"></i>
      <span>Movies</span>
    </div>
    <div class="nav-item" onclick="filterType('Series')">
      <i class="fa-solid fa-tv"></i>
      <span>Series</span>
    </div>
  </nav>

  <!-- Movie Details Modal -->
  <div class="modal-overlay" id="movie-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <div class="modal-hero" id="modal-poster"></div>
      <div class="modal-body">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-genres" id="modal-meta"></div>
        <div class="modal-desc" id="modal-desc"></div>
        
        <!-- Stream Action Area -->
        <div id="modal-actions"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let rawMovies = [];
    let currentFilterType = 'All';

    document.addEventListener('DOMContentLoaded', fetchMovies);

    async function fetchMovies() {
      const { data, error } = await sb.from('movies').select('*').order('id', { ascending: false });
      if (error) {
        console.error('Error:', error.message);
        return;
      }
      rawMovies = data || [];
      renderHeroBanner();
      renderMovies(rawMovies);
    }

    // Banner ပြသပေးခြင်း
    function renderHeroBanner() {
      if (rawMovies.length === 0) return;
      const featured = rawMovies[0]; // နောက်ဆုံးတင်ထားသော ကားကို Banner ပြမည်
      const hero = document.getElementById('hero-section');
      hero.innerHTML = `
        <div class="hero-banner" style="background-image: linear-gradient(to top, #0f172a, transparent), url('${featured.poster_url}');">
          <div class="hero-content">
            <h2>${featured.title}</h2>
            <p>⭐ ${featured.rating || '8.0'} | ${featured.category || 'Movie'}</p>
            <button class="btn-watch" style="width: auto; padding: 6px 16px; font-size: 12px;" onclick="openModal(${featured.id})">Watch Now</button>
          </div>
        </div>
      `;
    }

    // List ရေးဆွဲပေးခြင်း
    function renderMovies(list) {
      const grid = document.getElementById('movie-grid');
      document.getElementById('item-count').innerText = `${list.length} Items`;
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px;">No movies found.</div>`;
        return;
      }

      list.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => openModal(m.id);
        card.innerHTML = `
          <div class="poster-wrapper">
            <span class="badge-type">${m.type || 'Movie'}</span>
            <span class="badge-rating">⭐ ${m.rating || 'N/A'}</span>
            <img src="${m.poster_url}" alt="${m.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x225'">
          </div>
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div class="movie-meta">${m.category || 'General'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter - Categories
    function filterCategory(category) {
      document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'All') {
        renderMovies(rawMovies);
      } else {
        const filtered = rawMovies.filter(m => m.category && m.category.toLowerCase().includes(category.toLowerCase()));
        renderMovies(filtered);
      }
    }

    // Filter - Type (Movies vs Series from Bottom Nav)
    function filterType(type) {
      const filtered = rawMovies.filter(m => m.type === type);
      document.getElementById('section-heading').innerText = type === 'Movie' ? 'Movies Only' : 'TV Series Only';
      renderMovies(filtered);
    }

    // Real-time Search
    function filterMovies() {
      const text = document.getElementById('search-input').value.toLowerCase();
      const filtered = rawMovies.filter(m => m.title.toLowerCase().includes(text));
      renderMovies(filtered);
    }

    // Modal Details Window ဖွင့်ခြင်း
    function openModal(id) {
      const m = rawMovies.find(item => item.id === id);
      if (!m) return;

      document.getElementById('modal-poster').style.backgroundImage = `url('${m.poster_url}')`;
      document.getElementById('modal-title').innerText = m.title;
      document.getElementById('modal-meta').innerText = `${m.type || 'Movie'} • ⭐ ${m.rating || 'N/A'} • ${m.category || ''}`;
      document.getElementById('modal-desc').innerText = m.description || 'No storyline available.';

      const actionSec = document.getElementById('modal-actions');
      actionSec.innerHTML = '';

      if (m.type === 'Series' && m.episodes && m.episodes.length > 0) {
        let epHTML = `<div style="font-weight:bold; margin-bottom:8px; font-size:13px; color:var(--accent-color);">Select Episode:</div><div class="episodes-list">`;
        m.episodes.forEach(ep => {
          epHTML += `
            <a href="${ep.link}" target="_blank" class="ep-item">
              <span>▶ ${ep.title}</span>
              <i class="fa-solid fa-arrow-right-long"></i>
            </a>
          `;
        });
        epHTML += `</div>`;
        actionSec.innerHTML = epHTML;
      } else {
        actionSec.innerHTML = `<a href="${m.telegram_link || '#'}" target="_blank" class="btn-watch"><i class="fa-paper-plane fa-solid"></i> Watch on Telegram</a>`;
      }

      document.getElementById('movie-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movie-modal').style.display = 'none';
    }
  </script>
</body>
</html>

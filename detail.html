<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Detail - TelePlay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
    .detail-container { max-width: 800px; margin: 0 auto; }

    .movie-header { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .poster-img { width: 180px; height: 260px; object-fit: cover; border-radius: 12px; border: 1px solid var(--glass-border); }
    .info-side { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
    
    .movie-title { font-size: 24px; font-weight: bold; color: #fff; }
    
    /* Badges Layout */
    .badges-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
    .badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge.rating { color: #f59e0b; font-weight: bold; }
    
    /* View Counter Badge */
    .badge.view-badge {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .storyline {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 12px;
      line-height: 1.6;
      color: var(--text-sub);
      font-size: 14px;
      margin-top: 15px;
    }

    .btn-watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent-red);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="detail-container">
    <div class="movie-header">
      <img id="movie-poster" class="poster-img" src="" alt="Poster">
      <div class="info-side">
        <h1 id="movie-title" class="movie-title">Loading...</h1>
        
        <div class="badges-row">
          <div class="badge rating"><i class="fa-solid fa-star"></i> <span id="movie-rating">-</span></div>
          <div class="badge"><span id="movie-quality">1080p</span></div>
          <div class="badge"><span id="movie-category">Action</span></div>
          
          <!-- 👁️ View Count Badge -->
          <div class="badge view-badge">
            <i class="fa-regular fa-eye"></i>
            <span id="movie-views">0</span>
          </div>
        </div>

        <a id="watch-btn" href="#" target="_blank" class="btn-watch" style="display: none;">
          <i class="fa-solid fa-play"></i> Telegram တွင်ကြည့်မည်
        </a>
      </div>
    </div>

    <div class="storyline">
      <h3 style="color: #fff; margin-bottom: 8px;">ဇာတ်လမ်းအကျဉ်း</h3>
      <p id="movie-description">Loading storyline...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // URL parameter မှ Movie ID ကို ယူခြင်း (ဥပမာ detail.html?id=5)
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    document.addEventListener('DOMContentLoaded', () => {
      if (movieId) {
        loadMovieDetails(movieId);
      } else {
        document.getElementById('movie-title').innerText = "Movie ID ရှာမတွေ့ပါ။";
      }
    });

    async function loadMovieDetails(id) {
      // 1. Session Storage ထဲတွင် နောက်ဆုံး ကြည့်ခဲ့သည့် Movie ID ကို စစ်မည်
      const lastViewedMovieId = sessionStorage.getItem('last_viewed_movie_id');

      // အခြား Poster (Movie ID) ပြောင်းကြည့်မှသာ View +1 တိုးမည်
      if (lastViewedMovieId !== String(id)) {
        await sb.rpc('increment_views', { movie_id: id });
        sessionStorage.setItem('last_viewed_movie_id', String(id));
      }

      // 2. Supabase မှ Movie Data ကို ဆွဲယူမည်
      const { data: movie, error } = await sb
        .from('movies')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !movie) {
        console.error("Error loading movie:", error);
        document.getElementById('movie-title').innerText = "Movie ရှာမတွေ့ပါ။";
        return;
      }

      // 3. UI ထဲသို့ Data များ ထည့်သွင်းမည်
      document.getElementById('movie-title').innerText = movie.title || '';
      document.getElementById('movie-poster').src = movie.poster_url || 'https://via.placeholder.com/180x260';
      document.getElementById('movie-rating').innerText = movie.rating || 'N/A';
      document.getElementById('movie-quality').innerText = movie.quality || '1080p';
      document.getElementById('movie-category').innerText = movie.category || 'General';
      document.getElementById('movie-description').innerText = movie.description || 'အကျဉ်းချုပ် မရှိသေးပါ။';
      
      // View Count ကို ပြသမည် (တန်ဖိုးမရှိသေးပါက 1 ဟု ပြမည်)
      document.getElementById('movie-views').innerText = movie.views || 1;

      // Watch Link ပြသခြင်း
      if (movie.telegram_link) {
        const watchBtn = document.getElementById('watch-btn');
        watchBtn.href = movie.telegram_link;
        watchBtn.style.display = 'inline-flex';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelePlay - Details</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; }

    .header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { text-decoration: none; color: #f59e0b; font-size: 14px; font-weight: bold; background: #1e293b; padding: 6px 14px; border-radius: 6px; border: 1px solid #334155; }
    
    .detail-container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    
    .main-info { display: flex; gap: 16px; flex-direction: column; }
    
    @media (min-width: 600px) {
      .main-info { flex-direction: row; }
      .poster-wrap { width: 220px; flex-shrink: 0; }
    }

    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; background: #0f172a; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-q { position: absolute; top: 8px; right: 8px; background: #f59e0b; color: #000; font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 4px; }
    .badge-r { position: absolute; top: 8px; left: 8px; background: rgba(15, 23, 42, 0.9); color: #f59e0b; font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(245, 158, 11, 0.4); }

    .info-wrap { flex-grow: 1; display: flex; flex-direction: column; }
    .movie-title { font-size: 22px; font-weight: bold; color: #fff; margin: 0 0 8px 0; }
    
    .meta-tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tag { background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
    
    .desc-title { font-size: 14px; font-weight: bold; color: #f59e0b; margin-top: 10px; }
    .desc-text { font-size: 13px; color: #cbd5e1; line-height: 1.6; margin-top: 5px; }

    /* Single Movie Button */
    .btn-watch-main { display: block; background: #f59e0b; color: #000; text-align: center; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 15px; }
    .btn-watch-main:hover { background: #d97706; }

    /* Series Episode Section */
    .episodes-section { margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
    .episodes-title { font-size: 16px; font-weight: bold; color: #f59e0b; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .ep-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; text-decoration: none; color: #fff; text-align: center; font-size: 13px; font-weight: bold; transition: all 0.2s; }
    .ep-card:hover { border-color: #f59e0b; color: #f59e0b; transform: translateY(-2px); }

    #loading { text-align: center; padding: 50px; color: #f59e0b; }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="index.html" class="back-btn">← Back</a>
  </div>

  <div id="loading">Loading details...</div>

  <div id="content" class="detail-container" style="display: none;">
    <div class="main-info">
      <div class="poster-wrap">
        <img id="poster" src="" alt="Poster">
        <div class="badge-q" id="quality">1080p</div>
        <div class="badge-r" id="rating">⭐ 8.0</div>
      </div>
      <div class="info-wrap">
        <h1 class="movie-title" id="title">Movie Title</h1>
        
        <div class="meta-tags">
          <span class="tag" id="type-tag">Movie</span>
          <span class="tag" id="category-tag">Action</span>
        </div>

        <div class="desc-title">Storyline</div>
        <div class="desc-text" id="description">No description available.</div>

        <!-- Movie Single Link Button -->
        <a id="movie-watch-btn" href="#" target="_blank" class="btn-watch-main" style="display: none;">▶ Stream / Download Movie</a>
      </div>
    </div>

    <!-- Series Episodes Grid -->
    <div id="series-episodes-block" class="episodes-section" style="display: none;">
      <div class="episodes-title">
        <span>📺 Select Episode</span>
        <span style="font-size: 12px; color: #94a3b8;" id="ep-count">0 Episodes</span>
      </div>
      <div class="episodes-grid" id="episodes-grid"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boiqvzakfztlujjdiyhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9nHwP9SRRzgpxxslQ-gB6w_hT2Y-noa';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_POSTER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="240" viewBox="0 0 160 240"><rect width="100%" height="100%" fill="%23334155"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8" font-family="sans-serif" font-size="14">No Image</text></svg>';

    async function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('loading').innerText = '❌ Invalid Movie ID!';
        return;
      }

      const { data: m, error } = await sb.from('movies').select('*').eq('id', id).single();

      if (error || !m) {
        document.getElementById('loading').innerText = '❌ Item not found!';
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      document.title = m.title + ' - TelePlay';
      document.getElementById('title').innerText = m.title || 'Untitled';
      document.getElementById('poster').src = m.poster_url || DEFAULT_POSTER;
      document.getElementById('poster').onerror = function() { this.src = DEFAULT_POSTER; };
      
      document.getElementById('quality').innerText = m.quality || '1080p';
      document.getElementById('rating').innerText = '⭐ ' + (m.rating || 'N/A');
      document.getElementById('type-tag').innerText = m.type || 'Movie';
      document.getElementById('category-tag').innerText = m.category || 'General';
      document.getElementById('description').innerText = m.description || 'No description provided.';

      if (m.type === 'Series') {
        // Show Series Episodes Grid
        const epBlock = document.getElementById('series-episodes-block');
        const epGrid = document.getElementById('episodes-grid');
        const epCount = document.getElementById('ep-count');
        
        epBlock.style.display = 'block';
        epGrid.innerHTML = '';

        const episodes = m.episodes || [];
        epCount.innerText = episodes.length + ' Episodes';

        if (episodes.length === 0) {
          epGrid.innerHTML = '<div style="grid-column: 1/-1; color: #94a3b8;">No episodes uploaded yet.</div>';
        } else {
          episodes.forEach(ep => {
            const btn = document.createElement('a');
            btn.className = 'ep-card';
            btn.href = ep.link;
            btn.target = '_blank';
            btn.innerText = ep.title;
            epGrid.appendChild(btn);
          });
        }
      } else {
        // Show Movie Watch Button
        const watchBtn = document.getElementById('movie-watch-btn');
        watchBtn.style.display = 'block';
        watchBtn.href = m.telegram_link || '#';
      }
    }

    window.addEventListener('DOMContentLoaded', loadDetail);
  </script>
</body>
</html>
